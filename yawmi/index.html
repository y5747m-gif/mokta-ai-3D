<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>يومي | YAWMI — المنظم الذكي للطالب</title>
  <meta name="description" content="يومي | YAWMI — تطبيق منظّم الطالب الذكي: جدول أسبوعي، منبهات وتذكيرات، مذاكرة بمؤقت، واجبات ومراجعة متباعدة، عادات يومية، ومساعد تخطيط ذكي. يعمل دون إنترنت.">
  <meta name="theme-color" content="#12294F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="يومي">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div id="app" class="app">
    <!-- الشريط العلوي -->
    <header class="app-header" role="banner">
      <div class="brand">
        <img src="icons/icon-96.png" alt="" class="brand-icon" width="36" height="36">
        <div class="brand-text">
          <strong>يومي <span class="brand-sep">|</span> <span class="brand-latin">YAWMI</span></strong>
          <small data-i18n="brandSub">المنظّم الذكي للطالب</small>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="btn-assistant" title="المساعد الذكي" aria-label="المساعد الذكي">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3l1.6 4.2L18 8.8l-4.4 1.6L12 15l-1.6-4.6L6 8.8l4.4-1.6L12 3zM18.5 14l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9.9-2.3zM6 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg>
        </button>
        <button type="button" class="icon-btn bell" id="btn-notifications" title="مركز الإشعارات" aria-label="مركز الإشعارات">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 22a2.2 2.2 0 002.2-2.2H9.8A2.2 2.2 0 0012 22zm7-6.2v-5c0-3.2-1.8-5.6-4.7-6.3V4a2.3 2.3 0 10-4.6 0v.5C6.8 5.2 5 7.7 5 10.8v5l-2 2v1h18v-1l-2-2z"/></svg>
          <span class="bell-badge" id="bell-badge" hidden>0</span>
        </button>
        <button type="button" class="icon-btn" id="btn-theme" title="الوضع الليلي / النهاري" aria-label="الوضع الليلي / النهاري">
          <svg viewBox="0 0 24 24" class="ic ic-sun" aria-hidden="true"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zm0-14a1 1 0 011 1v2a1 1 0 11-2 0V4a1 1 0 011-1zm0 16a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM4 11H2a1 1 0 110-2h2a1 1 0 110 2zm18 0h-2a1 1 0 110-2h2a1 1 0 110 2zM5.6 5.6L4.2 4.2a1 1 0 011.4-1.4l1.4 1.4a1 1 0 11-1.4 1.4zm12.8 12.8l-1.4-1.4a1 1 0 011.4-1.4l1.4 1.4a1 1 0 01-1.4 1.4zM5.6 18.4a1 1 0 01-1.4 0L2.8 17a1 1 0 011.4-1.4l1.4 1.4a1 1 0 010 1.4zm12.8-12.8a1 1 0 01-1.4 0l-1.4-1.4A1 1 0 0117 2.8l1.4 1.4a1 1 0 010 1.4z"/></svg>
        </button>
      </div>
    </header>

    <!-- شريط الحالة: التاريخ والوقت والمنبه القادم -->
    <div class="status-strip" id="status-strip">
      <div class="status-date" id="status-date">—</div>
      <div class="status-clock" id="status-clock" aria-live="off">—</div>
      <button type="button" class="next-alarm-chip" id="next-alarm-chip" title="المنبه القادم">
        <svg viewBox="0 0 24 24" class="ic-sm" aria-hidden="true"><path d="M12 4a8 8 0 100 16 8 8 0 000-16zm1 8.6l3 1.8-.8 1.3-4.2-2.5V7h2v5.6z"/></svg>
        <span id="next-alarm-text">—</span>
      </button>
    </div>

    <!-- المحتوى -->
    <main id="screen" class="screen" tabindex="-1"></main>

    <!-- التنقل السفلي -->
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <a href="#/home" data-nav="home" class="nav-item">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-5v-6h-4v6H5a1 1 0 01-1-1v-9z"/></svg>
        <span data-i18n="navHome">الرئيسية</span>
      </a>
      <a href="#/schedule" data-nav="schedule" class="nav-item">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M7 2v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 8v10H5V10h14zM7 13v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg>
        <span data-i18n="navSchedule">الجدول</span>
      </a>
      <a href="#/study" data-nav="study" class="nav-item">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3L1 8l11 5 9-4.1V16h2V8L12 3zM5 12.5V16c0 1.7 3.1 3.5 7 3.5s7-1.8 7-3.5v-3.5l-7 3.2-7-3.2z"/></svg>
        <span data-i18n="navStudy">المذاكرة</span>
      </a>
      <a href="#/alarms" data-nav="alarms" class="nav-item">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 4a8 8 0 100 16 8 8 0 000-16zm1 8.6l3.2 1.9-.8 1.3-4.4-2.6V7h2v5.6zM3.5 5.2L2 3.7 3.7 2l1.5 1.5A9.9 9.9 0 002 12a10 10 0 0010 10 9.9 9.9 0 008.5-4.8l1.5 1.5 1.5-1.5-1.5-1.5A10 10 0 003.5 5.2z"/></svg>
        <span data-i18n="navAlarms">المنبهات</span>
      </a>
      <a href="#/account" data-nav="account" class="nav-item">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-9 2-9 5v3h18v-3c0-3-5-5-9-5z"/></svg>
        <span data-i18n="navAccount">حسابي</span>
      </a>
    </nav>
  </div>

  <!-- طبقات -->
  <div id="modal-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- طبقة المنبه المفتوح -->
  <div id="alarm-overlay" class="alarm-overlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="alarm-overlay-title">
    <div class="alarm-card">
      <div class="alarm-pulse" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="ic-lg"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.6l4 2.4-.8 1.3-5.2-3.1V6h2v6.6z"/></svg>
      </div>
      <div class="alarm-kind" id="alarm-overlay-kind">منبه</div>
      <h2 class="alarm-title" id="alarm-overlay-title">—</h2>
      <p class="alarm-message" id="alarm-overlay-message">—</p>
      <div class="alarm-time" id="alarm-overlay-time">—</div>
      <div class="alarm-actions">
        <button type="button" class="btn btn-ghost" id="alarm-btn-snooze">تأجيل</button>
        <button type="button" class="btn btn-danger" id="alarm-btn-dismiss">إيقاف</button>
        <button type="button" class="btn btn-primary" id="alarm-btn-done">تم التنفيذ ✓</button>
      </div>
    </div>
  </div>

  <noscript>
    <div style="padding:24px;font-family:sans-serif;text-align:center">
      يرجى تفعيل JavaScript لتشغيل تطبيق «يومي | YAWMI».
    </div>
  </noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
